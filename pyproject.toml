[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nanochat-jp-vllm"
version = "0.1.0"
description = "vLLM out-of-tree plugin for the NanoChatJP architecture (nanochat-jp checkpoints)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
# No runtime dependency on torch/vllm/transformers here: this plugin is
# installed *into* a vllm/vllm-openai container that already provides all
# three, at versions this code was written against. Pinning them here would
# risk pip trying to reinstall/upgrade them.
dependencies = []

[project.entry-points."vllm.general_plugins"]
nanochat_jp = "nanochat_jp_vllm:register"

[tool.setuptools.packages.find]
include = ["nanochat_jp_vllm*"]
